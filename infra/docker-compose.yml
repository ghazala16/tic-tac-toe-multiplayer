version: '3'

services:
  nakama:
    image: heroiclabs/nakama:3.23.0
    container_name: nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address postgres:localpassword@postgres:5432/nakama &&
          exec /nakama/nakama --name "tic-tac-toe-server"
          --database.address postgres:localpassword@postgres:5432/nakama
          --socket.port 7350
          --http.port 7350
          --config /nakama/data/nakama.yml
    volumes:
      - ../backend/nakama-config.yml:/nakama/data/nakama.yml
      - ../backend/modules:/nakama/data/modules
    depends_on:
      - postgres
    ports:
      - "7350:7350"
      - "7351:7351"

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: nakama
    ports:
      - "5432:5432"
